#VRML_SIM R2025a utf8
# ExplorerBot — a compact 4-wheel skid-steer car for the vertex_ros2
# route-exploration scenario (see ../README.md). Four driven wheels on a low
# chassis: stable (no casters) and fast.
#
# Wheels: axle along Y (car faces +X, up is +Z), so each wheel is a Cylinder
# (Webots cylinders are aligned with their local Y) spun by a HingeJoint whose
# axis is also Y — the cylinder therefore spins about its own axle and ROLLS
# forward. A contrasting spoke across each wheel makes the rolling visible.
#
# Devices:
#   * "front left wheel motor" / "front right wheel motor"
#     "rear left wheel motor"  / "rear right wheel motor"   RotationalMotor
#   * "gps"  GPS   ,  "imu"  InertialUnit  (yaw)
#   * "front_ds" DistanceSensor (present but unused: blocked-detection is by stall)

PROTO ExplorerBot [
  field SFVec3f    translation     0 0 0.05
  field SFRotation rotation        0 0 1 0
  field SFString   name            "explorer"
  field SFString   controller      "explorer_demo"
  field MFString   controllerArgs  []
  field SFColor    bodyColor       0.2 0.4 0.9
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    controllerArgs IS controllerArgs
    children [
      # --- chassis ---
      Shape {
        appearance PBRAppearance { baseColor IS bodyColor roughness 0.5 metalness 0.1 }
        geometry Box { size 0.34 0.20 0.07 }
      }
      # --- cabin ---
      Pose {
        translation -0.02 0 0.06
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.12 0.12 0.16 roughness 0.4 metalness 0.2 }
            geometry Box { size 0.16 0.17 0.06 }
          }
        ]
      }
      # --- front-left wheel ---
      HingeJoint {
        jointParameters HingeJointParameters { axis 0 1 0 anchor 0.12 0.11 0 }
        device [
          RotationalMotor { name "front left wheel motor" maxVelocity 30 acceleration 12 }
          PositionSensor { name "front left wheel sensor" }
        ]
        endPoint Solid {
          translation 0.12 0.11 0
          rotation 1 0 0 1.5708      # Webots cylinders are Z-aligned; rotate so the axle is Y (rolls on its tread)
          name "front left wheel"
          children [
            DEF WHEEL_VIS Group {
              children [
                DEF TIRE Shape {
                  appearance PBRAppearance { baseColor 0.08 0.08 0.08 roughness 1 }
                  geometry Cylinder { radius 0.05 height 0.03 }
                }
                # spoke across the wheel — rotates visibly with it
                Shape {
                  appearance PBRAppearance { baseColor 0.95 0.85 0.10 roughness 0.6 }
                  geometry Box { size 0.09 0.034 0.014 }
                }
              ]
            }
          ]
          boundingObject USE TIRE
          physics Physics { density -1 mass 0.1 }
        }
      }
      # --- front-right wheel ---
      HingeJoint {
        jointParameters HingeJointParameters { axis 0 1 0 anchor 0.12 -0.11 0 }
        device [
          RotationalMotor { name "front right wheel motor" maxVelocity 30 acceleration 12 }
          PositionSensor { name "front right wheel sensor" }
        ]
        endPoint Solid {
          translation 0.12 -0.11 0
          rotation 1 0 0 1.5708
          name "front right wheel"
          children [ USE WHEEL_VIS ]
          boundingObject USE TIRE
          physics Physics { density -1 mass 0.1 }
        }
      }
      # --- rear-left wheel ---
      HingeJoint {
        jointParameters HingeJointParameters { axis 0 1 0 anchor -0.12 0.11 0 }
        device [
          RotationalMotor { name "rear left wheel motor" maxVelocity 30 acceleration 12 }
          PositionSensor { name "rear left wheel sensor" }
        ]
        endPoint Solid {
          translation -0.12 0.11 0
          rotation 1 0 0 1.5708
          name "rear left wheel"
          children [ USE WHEEL_VIS ]
          boundingObject USE TIRE
          physics Physics { density -1 mass 0.1 }
        }
      }
      # --- rear-right wheel ---
      HingeJoint {
        jointParameters HingeJointParameters { axis 0 1 0 anchor -0.12 -0.11 0 }
        device [
          RotationalMotor { name "rear right wheel motor" maxVelocity 30 acceleration 12 }
          PositionSensor { name "rear right wheel sensor" }
        ]
        endPoint Solid {
          translation -0.12 -0.11 0
          rotation 1 0 0 1.5708
          name "rear right wheel"
          children [ USE WHEEL_VIS ]
          boundingObject USE TIRE
          physics Physics { density -1 mass 0.1 }
        }
      }
      DistanceSensor {
        name "front_ds"
        translation 0.18 0 0.06
        rotation 0 0 1 0
        type "generic"
        numberOfRays 1
        aperture 0.05
        lookupTable [ 0 0 0, 2 2000 0 ]
      }
      GPS { name "gps" }
      InertialUnit { name "imu" }
    ]
    boundingObject Box { size 0.34 0.20 0.07 }
    physics Physics { density -1 mass 2.0 }
  }
}
