[package]
name = "vertex_ros2"
version = "0.1.0"
edition = "2021"
description = "ROS 2 node (vertex_node) exposing Tashi Vertex consensus on /vertex/tx, /vertex/event, /vertex/sync_point, /vertex/status and /diagnostics."
license = "Apache-2.0"

# Built by colcon (ament_cargo) inside a ROS 2 workspace. `rclrs` and the
# generated message crates are provided by colcon-ros-cargo from the workspace
# install space; a bare `cargo build` outside colcon will not resolve them.
# All ROS-independent logic lives in `vertex_core`, which IS plain-`cargo`
# buildable and is where the test suite runs.

[[bin]]
name = "vertex_node"
path = "src/main.rs"

[dependencies]
vertex_core = { path = "../vertex_core" }

# Bridges the engine thread's tokio mpsc receivers onto ROS publishers.
tokio = { version = "1", features = ["sync", "rt"] }

# rclrs itself comes from the colcon/ROS 2 workspace: colcon-ros-cargo patches
# it to the ros2-rust overlay's copy, so this requirement only has to match the
# overlay's version (ros2_rust v0.8.0, pinned in docker/Dockerfile).
rclrs = "0.8"

# Generated message crates are no longer individual Cargo dependencies. Since
# ros2_rust 0.8 the generator registers them for `ros-env`, which re-exports
# every interface crate found on AMENT_PREFIX_PATH at build time, including
# our own vertex_ros2_msgs. Use them as `ros_env::<package>::msg::...`.
ros-env = "0.3"
