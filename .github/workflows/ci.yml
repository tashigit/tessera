name: vertex_ros2 CI (Jazzy)

# Runs the same Dockerized ROS 2 Jazzy harness that is used locally
# (docker-compose.yml) so the design acceptance criteria are verified in CI:
#   * `test`     — vertex_core cargo test + colcon build + the 3-node launch_test
#                  (ordering byte-for-byte, no-publish-in-Inactive, lifecycle
#                  cycle, clean shutdown).
#   * `sim-test` — all three simulation suites, headless (mock robots, no
#                  Webots): route exploration (parallel exploration, fault
#                  injection, lifecycle churn — vertex_ros2/test/simulation/),
#                  arena exploration (sector sweep with consensus health
#                  gating — vertex_ros2/test/simulation_arena/), and air/ground
#                  survey-and-sweep (a mixed fleet of tessera bots and native
#                  Rust drones, plus a Byzantine peer —
#                  vertex_ros2/test/simulation_airground/).
#   * `soak`     — the 10-minute RSS-growth launch_test, on a nightly schedule,
#                  plus the randomized mission soak (sim-soak).
#
# This repo is the only checkout needed: `vertex_core` pins `tashi-vertex` to
# `=0.14.0` from crates.io, and that crate's build script downloads the
# matching tashi-vertex-c release. No sibling, no PAT.
#
# Runner arch: `ubuntu-latest` is amd64; the local validation was arm64 (Apple
# Silicon). Both work — the v0.14.0 tashi-vertex-c release ships both
# `libtashi-vertex.so` (x86_64) and `libtashi-vertex-arm64.so`, and CMake picks
# the right one. To run CI on arm64 instead, set `runs-on: ubuntu-24.04-arm`.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # nightly soak (06:00 UTC)
  workflow_dispatch:
    inputs:
      run_soak:
        description: "Also run the soak test"
        type: boolean
        default: false

env:
  IMAGE: tessera-ros2:jazzy

jobs:
  system-test:
    # The 3-node launch_test + cargo test + colcon build.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tessera
        uses: actions/checkout@v4
        with:
          path: tessera

      - name: Free disk space
        # The full ros2-rust build + ROS base image + GHA cache export overflows
        # the runner's default free space; reclaim ~20 GB of preinstalled tooling.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the Jazzy environment image (cached)
        uses: docker/build-push-action@v6
        with:
          context: tessera/docker
          file: tessera/docker/Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run system tests (cargo test + colcon build + 3-node launch_test)
        working-directory: tessera
        run: docker compose run --rm test

  sim-test:
    # All three simulation suites, headless (no Webots): route exploration
    # (fsm unit tests + N1 exploration + N3 fault injection + N4 lifecycle
    # churn), arena exploration (fsm unit tests + the sector-sweep
    # launch_test), and air/ground (both folds' unit tests, the mixed-fleet
    # launch_test, and the Byzantine lying-drone launch_test). The air tier is
    # a native Rust binary rather than a colcon package, so the entrypoint
    # cargo-builds it for the runner's arch first. The viewer's JavaScript
    # fold is checked here on the runner, outside the image.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tessera
        uses: actions/checkout@v4
        with:
          path: tessera

      # The air/ground fold exists in three languages: Python for the bots,
      # Rust for the drones, JavaScript so the viewer can decode /vertex/event
      # itself. All three replay fixtures/conformance.json. The first two run
      # inside the Jazzy image via the entrypoint; this one runs here instead,
      # because the image has no Node and adding one for a single test costs
      # more than it saves. Runs before the image build so a fold divergence
      # fails in seconds rather than after a full colcon build.
      - name: Conformance — the viewer's JavaScript fold
        working-directory: tessera/vertex_ros2/test/simulation_airground/viewer
        run: node airground_fold.test.js

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the Jazzy environment image (cached)
        uses: docker/build-push-action@v6
        with:
          context: tessera/docker
          file: tessera/docker/Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run simulation suite (all three scenarios, headless)
        working-directory: tessera
        run: docker compose run --rm sim simtest

  miri:
    # Miri over vertex_core's pure-logic modules (design §7 "Miri'd in CI").
    # Miri cannot execute the libtashi-vertex C FFI, so it covers only the
    # FFI-free modules (lifecycle, convert); the "no double-send/double-free"
    # property is guaranteed statically by the move-only `Transaction` type.
    # Runs without Docker/ROS — vertex_core is plain-cargo and ROS-agnostic.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tessera
        uses: actions/checkout@v4
        with:
          path: tessera

      - name: Install nightly Rust + Miri
        run: rustup toolchain install nightly --component miri --profile minimal

      - name: Install CMake >= 4.2.3 (tashi-vertex build.rs requirement)
        run: pipx install "cmake>=4.2.3"

      - name: Miri (pure modules)
        working-directory: tessera/vertex_core
        run: |
          cargo +nightly miri setup
          cargo +nightly miri test --lib lifecycle
          cargo +nightly miri test --lib convert

  soak:
    # 10-minute RSS soak — nightly, or on demand via workflow_dispatch.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_soak)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tessera
        uses: actions/checkout@v4
        with:
          path: tessera

      - name: Free disk space
        # The full ros2-rust build + ROS base image + GHA cache export overflows
        # the runner's default free space; reclaim ~20 GB of preinstalled tooling.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the Jazzy environment image (cached)
        uses: docker/build-push-action@v6
        with:
          context: tessera/docker
          file: tessera/docker/Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run soak (10 min)
        working-directory: tessera
        run: docker compose run --rm -e SOAK_SECONDS=600 soak

      - name: Run mission soak (randomized back-to-back missions, 5 min)
        working-directory: tessera
        run: docker compose run --rm -e SOAK_SECONDS=300 sim simsoak
