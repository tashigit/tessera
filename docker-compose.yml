# tessera / vertex_ros2 — ROS 2 Jazzy build & test harness.
#
# Runs natively on Apple Silicon (the ros:jazzy base is multi-arch; Docker pulls
# the arm64 image on an M-series Mac). The project source is bind-mounted, so
# edit on the host and re-run without rebuilding the image.
#
# Usage (from the tessera repo root):
#   docker compose build                 # build the environment image (once)
#   docker compose run --rm test         # cargo test + colcon build + 3-node launch_test
#   docker compose run --rm core         # vertex_core cargo test only (fast)
#   docker compose run --rm build        # colcon build the vertex_ros2 node
#   docker compose run --rm shell        # interactive shell, env sourced
#   docker compose run --rm soak         # 10-min RSS soak (override: -e SOAK_SECONDS=120)
#   docker compose run --rm sim simtest  # all three simulations, headless
#   docker compose run --rm --service-ports sim simairground   # simulation 3, live
#
# Self-contained: `tashi-vertex` is pinned from crates.io and its build script
# downloads the matching tashi-vertex-c release, so this repo is the only
# checkout needed. tashi-vertex-c is optional — mount it to skip CMake's
# release download (see the commented lines below).

x-common: &common
  build:
    context: ./docker
    dockerfile: Dockerfile
  image: tessera-ros2:jazzy
  # Invoke via bash so the bind-mounted entrypoint needs only read (not the
  # executable bit, which macOS->Linux file sharing may drop). `command` (the
  # "test"/"core"/... verb) is appended as the script's argument.
  entrypoint: ["bash", "/usr/local/bin/entrypoint.sh"]
  volumes:
    - .:/ws/src/tessera
    # Mounted so entrypoint edits take effect without an image rebuild.
    - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    # Optional: build against the local tashi-vertex-c instead of downloading.
    # - ../tashi-vertex-c:/opt/tashi-vertex-c:ro
  # environment:
  #   TASHI_VERTEX_LOCAL_DIR: /opt/tashi-vertex-c
  working_dir: /ws
  # colcon/cargo build artifacts persist in named volumes across runs for speed.
  # (Kept off the bind mounts so host trees stay clean and Linux/macOS object
  # files never collide.)

services:
  test:
    <<: *common
    command: ["test"]
    volumes:
      - .:/ws/src/tessera
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - build-cache:/ws/build
      - install-cache:/ws/install
      - target-cache:/ws/src/tessera/vertex_core/target

  core:
    <<: *common
    command: ["core"]

  build:
    <<: *common
    command: ["build"]
    volumes:
      - .:/ws/src/tessera
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - build-cache:/ws/build
      - install-cache:/ws/install

  soak:
    <<: *common
    command: ["soak"]

  shell:
    <<: *common
    command: ["shell"]
    stdin_open: true
    tty: true

  # Route-exploration simulation, container side (rosbridge + vertex_node +
  # mission_coordinator). Webots runs natively on the host and connects to
  # rosbridge on localhost:9090. Run with:  docker compose run --rm --service-ports sim
  sim:
    <<: *common
    command: ["sim"]
    ports:
      - "9090:9090"
      # The air/ground simulation's drones do not use rosbridge. Their
      # Mac-side Webots controllers dial their air_agent directly over a
      # JSON-lines TCP socket, one port each.
      - "48633:48633"
      - "48634:48634"
    volumes:
      - .:/ws/src/tessera
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - build-cache:/ws/build
      - install-cache:/ws/install

volumes:
  build-cache:
  install-cache:
  target-cache:
