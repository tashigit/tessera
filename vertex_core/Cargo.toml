[package]
name = "vertex_core"
version = "0.2.0"
edition = "2021"
description = "ROS-agnostic core of the Vertex/ROS 2 integration: lifecycle, the Tokio<->channel bridge, the engine task, and Vertex->message conversion. Verified by `cargo test` with no ROS install."
license = "BUSL-1.1"

[dependencies]
tashi-vertex = "=0.16.0-rc3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
arc-swap = "1"
thiserror = "2"

[dev-dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
